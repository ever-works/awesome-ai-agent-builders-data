markdown: >-
  ## Overview


  LangGraph is a low-level framework for building long-running, stateful AI
  agents with explicit control over the execution graph.


  ## Features


  - Long-running agent support

  - Stateful agent management

  - Explicit execution graph control

  - Multi-agent orchestration


  ## Deployment


  - Library for self-managed applications

  - Vendor platform available


  ## License


  MIT License
