  ## Overview


  Microsoft Agent Framework is a framework for building and coordinating AI
  agents across Python and .NET applications.


  ## Features


  - Agent building framework

  - Cross-language support (Python and .NET)

  - Agent coordination

  - Multi-agent orchestration


  ## Deployment


  - Library for self-managed applications

  - Cloud application support


