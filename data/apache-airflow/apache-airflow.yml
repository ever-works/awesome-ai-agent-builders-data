markdown: >-
  ## Overview


  Apache Airflow is a Python platform for developing, scheduling, and monitoring
  batch workflows as code.


  ## Features


  - Workflow development as code

  - Scheduling capabilities

  - Workflow monitoring

  - Batch workflow processing

  - Python-based workflow definition


  ## Deployment


  - Self-hosted

  - Third-party managed services available


