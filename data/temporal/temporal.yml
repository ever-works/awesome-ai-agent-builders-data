  ## Overview


  Temporal is a durable execution platform that preserves application state and
  retries workflow steps through failures.


  ## Features


  - Durable execution

  - Application state preservation

  - Automatic retry of workflow steps

  - Failure recovery

  - Workflow orchestration


  ## Deployment


  - Self-hosted

