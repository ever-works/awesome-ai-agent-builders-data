markdown: >-
  ## Overview


  Kuse Cowork is a local-first desktop AI coworker that works across documents
  and tasks, allowing users to select their own models.


  ## Features


  - Local-first desktop operation

  - Document and task integration

  - User-selected AI models

  - Cross-application task management


  ## Deployment


  - Local desktop application

  - Optional Docker isolation


